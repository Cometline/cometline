# Lint config for comet-sdk. Run with `make lint` from the repo root.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unparam
    - unused

  settings:
    depguard:
      rules:
        # ── Dependency direction ─────────────────────────────────────────────
        # The SDK sits at the bottom of the stack: cometline → cometmind →
        # comet-sdk.
        sdk-never-imports-runtime:
          files:
            - $all
          deny:
            - pkg: github.com/Cometline/cometline/cometmind
              desc: comet-sdk must not depend on the cometmind runtime

    gocritic:
      disabled-checks:
        # If-else chains over unrelated conditions often read better than a bare switch.
        - ifElseChain

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        # redefines-builtin-id is off: local `max`/`min`/`cap` names predate the Go 1.21
        # builtins and get renamed as files are split in Phase 3.

    staticcheck:
      checks:
        - all
        # Defaults from golangci-lint (doc-comment style checks).
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Quick-fix suggestions (De Morgan, tagged switch) that are style, not bugs.
        - -QF1001
        - -QF1002
        - -QF1003
        # Explicit struct literals keep look-alike types decoupled if fields diverge.
        - -S1016

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers favor uniform call sites over minimal parameter lists.
      - path: _test\.go
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
