name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Go comes from the `toolchain` line in each module's go.mod, so CI, release,
  # and local builds use the same patched release.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      cometmind: ${{ steps.filter.outputs.cometmind }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Makefile
            sdk:
              - *shared
              - comet-sdk/**
            cometmind:
              - *shared
              - comet-sdk/**
              - cometmind/**
            frontend:
              - *shared
              - cometline/**
              - cometmind/openapi.yaml
            codegen:
              - *shared
              - cometmind/openapi.yaml
              - cometmind/sqlc.yaml
              - cometmind/go.mod
              - cometmind/internal/apigen/**
              - cometmind/internal/db/**
              - cometline/package.json
              - cometline/pnpm-lock.yaml
              - cometline/src/lib/generated/**

  codegen:
    name: Generated code
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cometmind/go.mod
          cache-dependency-path: |
            comet-sdk/go.sum
            cometmind/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cometline/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cometline/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir cometline install --frozen-lockfile

      - name: Check OpenAPI clients are up to date
        run: make check-generated

      - name: Check sqlc output is up to date
        run: make check-sqlc

  sdk:
    name: comet-sdk
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: comet-sdk/go.mod
          cache-dependency-path: |
            comet-sdk/go.sum
            cometmind/go.sum

      - name: Check gofmt
        run: test -z "$(gofmt -l comet-sdk)" || { gofmt -l comet-sdk; exit 1; }

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: comet-sdk

      - name: Test with race detector
        working-directory: comet-sdk
        run: go test -race ./...

      - name: Check for vulnerabilities
        working-directory: comet-sdk
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  cometmind:
    name: cometmind
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.cometmind == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cometmind/go.mod
          cache-dependency-path: |
            comet-sdk/go.sum
            cometmind/go.sum

      - name: Check gofmt
        run: test -z "$(gofmt -l cometmind)" || { gofmt -l cometmind; exit 1; }

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: cometmind

      - name: Test with race detector
        working-directory: cometmind
        run: go test -race ./...

      - name: Check for vulnerabilities
        working-directory: cometmind
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build binary
        run: make cometmind-build

  frontend:
    name: cometline frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cometline
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cometline/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cometline/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  readability:
    name: Readability report
    runs-on: ubuntu-latest
    # Budgets are reported, not enforced, until Phase 5 ratchets them.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cometmind/go.mod
          cache-dependency-path: |
            comet-sdk/go.sum
            cometmind/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Scorecard
        run: scripts/readability-report.sh

      - name: Function length and complexity budgets
        run: make lint-budget GOLANGCI_LINT=golangci-lint

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            chore
            ci

  electron-smoke:
    name: Electron packaging smoke (macOS)
    needs: [cometmind, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cometmind/go.mod
          cache-dependency-path: |
            comet-sdk/go.sum
            cometmind/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cometline/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cometline/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir cometline install --frozen-lockfile

      - name: Build unsigned app bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm --dir cometline run build:sidecar
          pnpm --dir cometline run build
          pnpm --dir cometline exec electron-builder --mac --dir --publish never \
            -c.mac.identity=null -c.mac.notarize=false
