name: Bug report
description: Something in Cometline, CometMind, or comet-sdk does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, use private reporting instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app (cometline)
        - Agent runtime (cometmind)
        - SDK (comet-sdk)
        - Discord gateway
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Settings → About shows the app version. For source builds, give the commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15.3, Apple Silicon, provider = Anthropic
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from ~/.cometmind/logs/cometline.log. Remove API keys and tokens first.
      render: text
