openapi: 3.1.0
info:
  title: CometMind Local Serve API
  version: 0.1.0
  description: |
    Minimal local HTTP + SSE surface for CometMind Phase 0.

    v1 is localhost-only, has no app-layer auth, keeps `/api/v1` path versioning,
    and exposes only the first serve slice endpoints.
servers:
  - url: http://127.0.0.1:7700
    description: Default local bind address
tags:
  - name: Health
  - name: Models
  - name: Workspaces
  - name: Files
  - name: Sessions
  - name: Skills
  - name: MCP
  - name: Memory
  - name: Storage
  - name: Inbox
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Check server liveness
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok

  /api/v1/models/catalog-lookups:
    post:
      tags: [Models]
      summary: Resolve catalog limits for model ids
      description: |
        Batch-resolves models.dev context/output/vision for arbitrary model ids
        under a provider method. Used after Fetch models so the settings list can
        show limits before models are enabled and saved.
      operationId: lookupModelCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCatalogLookupRequest'
      responses:
        '200':
          description: Resolved catalog entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogLookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List registered workspaces
      operationId: listWorkspaces
      responses:
        '200':
          description: Registered workspace roots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Workspaces]
      summary: Register or resolve a workspace by path
      description: |
        Ensures a workspace exists for the given absolute filesystem path.
        Returns the registered workspace id and normalized path.
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace registered or resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Workspaces]
      summary: Remove an unused workspace registration
      description: |
        Deletes a workspace registration when no sessions reference it.
        Returns 204 when the path is not registered or was removed successfully.
      operationId: deleteWorkspace
      parameters:
        - name: workspace_path
          in: query
          required: true
          schema:
            type: string
          description: Absolute workspace path to remove from CometMind registrations.
      responses:
        '204':
          description: Workspace removed or not registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Workspace still has sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/prune-runs:
    post:
      tags: [Workspaces]
      summary: Prune missing workspace registrations
      description: |
        Removes registered workspaces whose directories no longer exist on disk
        and that have no sessions. Workspaces with sessions are kept for history
        but are omitted from workspace pickers.
      operationId: pruneWorkspaces
      responses:
        '200':
          description: Prune completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruneWorkspacesResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/git/status:
    get:
      tags: [Files]
      summary: List git changes for a workspace
      description: |
        Returns changed files for the workspace when it is inside a git work tree.
        Paths are workspace-relative. Read-only; does not stage or commit.
      operationId: getWorkspaceGitStatus
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
          description: Registered workspace identifier.
        - name: workspace_path
          in: query
          required: false
          schema:
            type: string
          description: Absolute workspace path for an already-registered workspace.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [working, staged, all]
            default: working
          description: |
            working = unstaged + untracked (default);
            staged = index only;
            all = staged + unstaged + untracked.
      responses:
        '200':
          description: Git status for the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGitStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/git/diff:
    get:
      tags: [Files]
      summary: Get a unified git diff for one workspace file
      description: |
        Returns a unified diff for a single workspace-relative path.
        Untracked text files are shown as a new-file diff. Binary and oversized
        files are reported without a full body.
      operationId: getWorkspaceGitDiff
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_path
          in: query
          required: false
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Workspace-relative file path.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [working, staged, all]
            default: working
      responses:
        '200':
          description: Unified diff for the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGitDiff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/git/stage:
    post:
      tags: [Files]
      summary: Stage workspace files in git
      description: Runs `git add` for the given workspace-relative paths.
      operationId: stageWorkspaceGitPaths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGitPathsRequest'
      responses:
        '200':
          description: Paths staged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGitMutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/git/unstage:
    post:
      tags: [Files]
      summary: Unstage workspace files in git
      description: Runs `git restore --staged` for the given workspace-relative paths.
      operationId: unstageWorkspaceGitPaths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGitPathsRequest'
      responses:
        '200':
          description: Paths unstaged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGitMutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/git/discard:
    post:
      tags: [Files]
      summary: Discard local changes for workspace files
      description: |
        Restores tracked paths to HEAD (index + worktree) and deletes untracked files.
        Untracked directories are rejected.
      operationId: discardWorkspaceGitPaths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGitPathsRequest'
      responses:
        '200':
          description: Paths discarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGitMutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/git/commit:
    post:
      tags: [Files]
      summary: Commit staged changes in a workspace
      description: |
        Creates a git commit from the current index with the provided message.
        Does not auto-stage; stage paths first.
      operationId: commitWorkspaceGit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGitCommitRequest'
      responses:
        '200':
          description: Commit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGitCommitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/files:
    get:
      tags: [Files]
      summary: List files and directories in a workspace
      description: |
        Returns all workspace-relative file and directory paths for the requested workspace.
        Directory paths end with `/`.
        `.git` and `node_modules` directories are skipped.
      operationId: listWorkspaceFiles
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
          description: Registered workspace identifier.
        - name: workspace_path
          in: query
          required: false
          schema:
            type: string
          description: Absolute workspace path for an already-registered workspace.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional substring filter on the relative file or directory path.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
          description: Maximum number of results to return.
      responses:
        '200':
          description: Workspace file and directory list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/files/children:
    get:
      tags: [Files]
      summary: List direct children of a workspace directory
      description: |
        Returns direct file and directory children of a workspace-relative directory.
        Pass an empty directory for the workspace root. Directory paths end with `/`.
        `.git` and `node_modules` directories are skipped.
      operationId: listWorkspaceFileChildren
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
          description: Registered workspace identifier.
        - name: workspace_path
          in: query
          required: false
          schema:
            type: string
          description: Absolute workspace path for an already-registered workspace.
        - name: directory
          in: query
          required: false
          schema:
            type: string
          description: Workspace-relative directory path. Omit for the workspace root.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 10000
          description: Maximum number of direct children to return.
      responses:
        '200':
          description: Direct workspace file and directory children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/files/content:
    get:
      tags: [Files]
      summary: Read a workspace file for preview
      description: |
        Returns the contents of a workspace-relative file for in-app preview.
        Text files return UTF-8 content; common image types return a data URL.
        Files larger than 256 KB cannot be previewed.
      operationId: readWorkspaceFileContent
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_path
          in: query
          required: false
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Workspace-relative file path.
      responses:
        '200':
          description: File preview content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Files]
      summary: Write a workspace file for preview editing
      description: |
        Writes UTF-8 text content back to an existing workspace-relative file.
        Image files, binary content, and files larger than 256 KB are rejected.
      operationId: writeWorkspaceFileContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteWorkspaceFileRequest'
      responses:
        '204':
          description: File saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wiki/files:
    get:
      tags: [Files]
      summary: List files and directories in the LLM wiki
      description: |
        Returns all wiki-root-relative file and directory paths under `~/.cometmind/wiki/`.
        Directory paths end with `/`.
      operationId: listWikiFiles
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Optional substring filter on the relative file or directory path.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
          description: Maximum number of results to return.
      responses:
        '200':
          description: Wiki file and directory list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiFileList'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wiki/files/children:
    get:
      tags: [Files]
      summary: List direct children of an LLM wiki directory
      description: |
        Returns direct file and directory children of a wiki-root-relative directory.
        Pass an empty directory for the wiki root. Directory paths end with `/`.
      operationId: listWikiFileChildren
      parameters:
        - name: directory
          in: query
          required: false
          schema:
            type: string
          description: Wiki-root-relative directory path. Omit for the wiki root.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 10000
          description: Maximum number of direct children to return.
      responses:
        '200':
          description: Direct wiki file and directory children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiFileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wiki/files/backlinks:
    get:
      tags: [Files]
      summary: List backlinks for a wiki file
      description: |
        Returns wiki-root-relative `.md` paths that contain a resolved `[[wikilink]]`
        pointing at the requested page. Hidden files and `raw/**` are skipped when
        scanning. The scan is performed on demand.
      operationId: listWikiFileBacklinks
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Wiki-root-relative file path (e.g. `entities/foo.md`).
      responses:
        '200':
          description: Backlink list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiFileBacklinks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wiki/files/content:
    get:
      tags: [Files]
      summary: Read a wiki file for preview
      description: |
        Returns the contents of a wiki-root-relative file for in-app preview.
        Text files return UTF-8 content; common image types return a data URL.
        Files larger than 256 KB cannot be previewed.
      operationId: readWikiFileContent
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Wiki-root-relative file path (e.g. `index.md`, `entities/foo.md`).
      responses:
        '200':
          description: File preview content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiFileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Files]
      summary: Write a wiki file for preview editing
      description: |
        Writes UTF-8 text content back to an existing wiki file.
        `raw/**` and `WIKI.md` are read-only. Image files, binary content,
        and files larger than 256 KB are rejected.
      operationId: writeWikiFileContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteWikiFileRequest'
      responses:
        '204':
          description: File saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sessions:
    post:
      tags: [Sessions]
      summary: Create a session
      description: |
        Creates a new session for an explicit workspace selection.

        Provide either `workspace_id` or `workspace_path`.
        When `workspace_path` is provided and the workspace is not yet registered,
        CometMind auto-registers it before creating the session.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            examples:
              byWorkspacePath:
                summary: Create by workspace path
                value:
                  workspace_path: /Users/tomlord/workspace/personal-project/cometline
              byWorkspaceId:
                summary: Create by workspace id
                value:
                  workspace_id: ws_01JABCDEF
                  model_id: claude-sonnet-4-5
                  provider_id: anthropic
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                id: sess_01JABCDEF
                workspace_id: ws_01JABCDEF
                workspace_path: /Users/tomlord/workspace/personal-project/cometline
                title: ""
                model_id: claude-sonnet-4-5
                provider_id: anthropic
                status: active
                origin: user
                token_usage:
                  input_tokens: 0
                  output_tokens: 0
                  cache_read: 0
                  cache_write: 0
                pinned: false
                agent_mode: auto
                created_at: 1746880000000
                updated_at: 1746880000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Sessions]
      summary: List sessions for one workspace
      description: |
        Lists sessions for exactly one workspace scope.

        Supply either `workspace_id` or `workspace_path`.
        This endpoint is workspace-scoped and requires one of those query parameters.
        Unlike session creation, `workspace_path` does not auto-register missing workspaces.
      operationId: listSessions
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
          description: Registered workspace identifier.
        - name: workspace_path
          in: query
          required: false
          schema:
            type: string
          description: Absolute workspace path for an already-registered workspace.
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns top-level sessions across all workspaces and ignores workspace scope.
      responses:
        '200':
          description: Sessions for the requested workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
              example:
                sessions:
                  - id: sess_01JABCDEF
                    workspace_id: ws_01JABCDEF
                    workspace_path: /Users/tomlord/workspace/personal-project/cometline
                    title: Investigate serve slice
                    model_id: claude-sonnet-4-5
                    provider_id: anthropic
                    status: active
                    origin: user
                    token_usage:
                      input_tokens: 1200
                      output_tokens: 340
                      cache_read: 0
                      cache_write: 0
                    pinned: false
                    agent_mode: auto
                    created_at: 1746880000000
                    updated_at: 1746880200000
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get one session
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Sessions]
      summary: Update session fields
      description: |
        Partial update for an existing session. Send any combination of
        `model_id`/`provider_id` (both required together), `pinned`, or `title`.
      operationId: patchSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Updated session resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Sessions]
      summary: Delete one session
      description: Removes the session and cascades its persisted messages and tool-call rows.
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sessions/{id}/forks:
    post:
      tags: [Sessions]
      summary: Fork a session into a different workspace
      description: |
        Creates a new session in the target workspace, copying the source session's
        title, model, and full message/tool-call transcript. The original session is
        left untouched. Returns the newly created session.
      operationId: forkSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSessionRequest'
      responses:
        '201':
          description: Forked session resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sessions/{id}/messages:
    delete:
      tags: [Sessions]
      summary: Clear session transcript
      description: |
        Deletes all messages and tool calls for the session, resets compaction summary
        state, token usage, and title, while preserving the session id and workspace.
      operationId: clearSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Transcript cleared
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Sessions]
      summary: Get transcript-style session messages
      description: |
        Returns a transcript-style API model rather than raw database rows.
        Tool rows include both the tool input and the recorded tool output.
      operationId: getSessionMessages
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Transcript items for the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptResponse'
              example:
                session_id: sess_01JABCDEF
                items:
                  - type: user
                    text: Inspect the entrypoint.
                  - type: reasoning
                    text: I should inspect the entrypoint before changing the server wiring.
                  - type: assistant
                    text: I found the serve command entrypoint.
                  - type: tool
                    tool_name: read_file
                    tool_input:
                      path: main.go
                    tool_output: |-
                      package main
                    tool_error: false
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Sessions]
      summary: Send one message and stream events over SSE
      description: |
        Accepts text and optional base64 image attachments, then responds with `text/event-stream`.

        The SSE payloads reuse CometMind-native event names discriminated by `type`:
        `text_delta`, `reasoning_start`, `reasoning_delta`, `tool_call`,
        `tool_result`, `step_finish`, `subagent_started`, `subagent_progress`,
        `subagent_finished`, `memory_injected`,
        `memory_updated`, `context_budget`, `assistant_image`, `error`, and `done`.

        Each `data:` frame body matches `#/components/schemas/StreamEvent`.
        `tool_call.input` is a JSON object. `tool_result.output` is text.
      operationId: postSessionMessage
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
            example:
              text: Inspect the server package and summarize the next change.
              images:
                - media_type: image/png
                  data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session already has an in-flight run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: session_running
                  message: session sess_01JABCDEF already running
        '500':
          $ref: '#/components/responses/InternalError'

