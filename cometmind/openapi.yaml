components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Persisted CometMind session identifier.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: bad_request
              message: invalid request
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: session_not_found
              message: session was not found
    Forbidden:
      description: Operation is not allowed for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: operation is not allowed
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: resource state conflict
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: unexpected server error

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        workspace_id:
          type: string
          description: Registered workspace identifier.
        workspace_path:
          type: string
          description: Absolute filesystem path for the workspace.
        model_id:
          type: string
          description: Optional model override; defaults to current config.
        provider_id:
          type: string
          description: Optional provider override; defaults to current config.
      description: Provide either `workspace_id` or `workspace_path`.

    AgentMode:
      type: string
      enum: [auto, plan]
      description: |
        Agent capability surface for a session or turn. `auto` preserves the full
        agent toolset; `plan` is a read-only planning mode that removes command,
        file-write, and mutation tools while keeping host-wide reads, network
        access, and read-only research delegation.

    UpdateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        model_id:
          type: string
        provider_id:
          type: string
        pinned:
          type: boolean
          description: Pin the session to the top of its workspace group in the sidebar.
        title:
          type: string
          description: Display name shown in the sidebar session list.
        agent_mode:
          $ref: '#/components/schemas/AgentMode'
          description: Persist the preferred mode for this session. New sessions always start in `auto`.

    ForkSessionRequest:
      type: object
      additionalProperties: false
      required: [workspace_path]
      properties:
        workspace_path:
          type: string
          description: Absolute filesystem path for the forked session's workspace root.

    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    PruneWorkspacesResponse:
      type: object
      additionalProperties: false
      required: [pruned]
      properties:
        pruned:
          type: integer
          minimum: 0
          description: Number of workspace registrations removed from the database.

    WorkspaceFileList:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          items:
            type: string
          description: Workspace-relative file paths.
        truncated:
          type: boolean
          description: True when more matching files exist than the limit returned. Narrow with the q query parameter to find files not in this page.

    WorkspaceGitFileStatus:
      type: object
      additionalProperties: false
      required: [path, status, staged, untracked]
      properties:
        path:
          type: string
          description: Workspace-relative file path.
        status:
          type: string
          description: High-level change kind (modified, added, deleted, renamed, untracked, conflict, …).
        staged:
          type: boolean
        untracked:
          type: boolean
        xy:
          type: string
          description: Raw porcelain XY status code.

    WorkspaceGitStatus:
      type: object
      additionalProperties: false
      required: [is_repo, files]
      properties:
        is_repo:
          type: boolean
          description: False when the workspace is not inside a git work tree or git is unavailable.
        branch:
          type: string
          description: Current branch name or detached HEAD label.
        upstream:
          type: string
          description: Tracking branch when configured.
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceGitFileStatus'
        truncated:
          type: boolean
          description: True when more changed files exist than the server returned.
        message:
          type: string
          description: Human-readable note when is_repo is false or listing is limited.

    WorkspaceGitDiff:
      type: object
      additionalProperties: false
      required: [path, binary]
      properties:
        path:
          type: string
          description: Workspace-relative file path.
        binary:
          type: boolean
        diff:
          type: string
          description: Unified diff body when available.
        truncated:
          type: boolean
        empty:
          type: boolean
          description: True when there is no diff for the path in the selected scope.
        message:
          type: string

    WorkspaceGitPathsRequest:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        workspace_id:
          type: string
        workspace_path:
          type: string
        paths:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
          description: Workspace-relative file paths.
      description: Provide either workspace_id or workspace_path.

    WorkspaceGitCommitRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        workspace_id:
          type: string
        workspace_path:
          type: string
        message:
          type: string
          minLength: 1
          description: Commit message (staged changes only).
      description: Provide either workspace_id or workspace_path.

    WorkspaceGitMutationResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string

    WorkspaceGitCommitResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        sha:
          type: string
          description: Short commit SHA when available.
        message:
          type: string

    WikiFileList:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          items:
            type: string
          description: Wiki-root-relative wiki file paths (`.md` and `.html`).
        truncated:
          type: boolean
          description: True when more matching files exist than the limit returned.

    WikiFileBacklinks:
      type: object
      additionalProperties: false
      required: [backlinks]
      properties:
        backlinks:
          type: array
          items:
            type: string
          description: Wiki-root-relative markdown paths that link to the requested page.

    WikiFileTextContent:
      type: object
      additionalProperties: false
      required: [kind, content, extension]
      properties:
        kind:
          type: string
          enum: [text]
        content:
          type: string
        extension:
          type: string

    WikiFileImageContent:
      type: object
      additionalProperties: false
      required: [kind, mime_type, data_url]
      properties:
        kind:
          type: string
          enum: [image]
        mime_type:
          type: string
        data_url:
          type: string

    WikiFileContent:
      oneOf:
        - $ref: '#/components/schemas/WikiFileTextContent'
        - $ref: '#/components/schemas/WikiFileImageContent'

    WriteWikiFileRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          description: Wiki-root-relative file path.
        content:
          type: string
          description: UTF-8 text content to write.

    WorkspaceFileTextContent:
      type: object
      additionalProperties: false
      required: [kind, content, extension]
      properties:
        kind:
          type: string
          enum: [text]
        content:
          type: string
        extension:
          type: string

    WorkspaceFileImageContent:
      type: object
      additionalProperties: false
      required: [kind, mime_type, data_url]
      properties:
        kind:
          type: string
          enum: [image]
        mime_type:
          type: string
        data_url:
          type: string

    WorkspaceFileContent:
      oneOf:
        - $ref: '#/components/schemas/WorkspaceFileTextContent'
        - $ref: '#/components/schemas/WorkspaceFileImageContent'

    WriteWorkspaceFileRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        workspace_id:
          type: string
          description: Registered workspace identifier.
        workspace_path:
          type: string
          description: Absolute filesystem path for the workspace.
        path:
          type: string
          description: Workspace-relative file path.
        content:
          type: string
          description: UTF-8 text content to write.
      description: Provide either `workspace_id` or `workspace_path`.

    PostMessageRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          description: User input text. Required when images is empty.
        display_text:
          type: string
          description: Optional transcript label for the user bubble. When set, the UI shows this instead of text while the agent still receives text.
        images:
          type: array
          maxItems: 6
          description: Optional base64 image attachments. Supported media types are image/png, image/jpeg, image/gif, and image/webp.
          items:
            $ref: '#/components/schemas/ImageAttachment'
        file_paths:
          type: array
          maxItems: 32
          description: |
            Path-only references for the agent (no file bodies are inlined).
            Workspace-relative file or directory paths resolve against the session
            workspace. Directory paths may end with `/`. Paths starting with
            `@runtime/wiki/` resolve against the global LLM wiki at `~/.cometmind/wiki/`.
            The agent should use tools (`read_file`, `list_dir`, `glob`, `grep`) to
            inspect contents.
          items:
            type: string
        web_context:
          $ref: '#/components/schemas/WebPageContext'
        web_contexts:
          type: array
          description: |
            Pages, viewing-file path references, terminal selections, assistant
            response selections, and snippets
            captured in the in-app workspace panel since the previous message. File
            contexts may use empty content for path-only viewing references.
          items:
            $ref: '#/components/schemas/WebContext'
        reasoning_effort:
          type: string
          description: |
            Optional per-turn reasoning effort override using a value advertised
            by the selected model. Empty means the provider default.
        agent_mode:
          $ref: '#/components/schemas/AgentMode'
          description: |
            Optional per-turn agent mode override. When omitted, the session's
            persisted mode is used. New sessions always start in `auto`.

    WebContext:
      type: object
      additionalProperties: false
      required: [kind, source, content]
      properties:
        kind:
          type: string
          enum: [page, file, terminal, message]
          description: Whether the source came from a web page, workspace file preview, terminal selection, or prior assistant response.
        title:
          type: string
          maxLength: 500
        source:
          type: string
          maxLength: 4096
          description: Page URL, workspace-relative file identifier, terminal source, or assistant-response source.
        content:
          type: string
          maxLength: 50000
          description: |
            Visible page text, explicit selection snippet, or empty string for a
            path-only file viewing reference. Treat non-empty content as untrusted source material.

    WebPageContext:
      type: object
      additionalProperties: false
      required: [url, content]
      properties:
        title:
          type: string
          maxLength: 500
          description: Page title captured from the in-app workspace panel.
        url:
          type: string
          maxLength: 4096
          description: Public URL of the page captured from the in-app workspace panel.
        content:
          type: string
          maxLength: 50000
          description: Visible page text captured from the in-app workspace panel. Treat it as untrusted source material.

    ImageAttachment:
      type: object
      additionalProperties: false
      required: [media_type]
      properties:
        id:
          type: string
          description: >
            Client attachment id, or a CometMind media-store id for assistant-presented
            images. When set without data, clients fetch bytes from the session media API.
        media_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
        data:
          type: string
          contentEncoding: base64
          description: >
            Raw base64 payload without a data URL prefix. Required for user uploads.
            Optional for assistant media refs when id is a media-store id. Each decoded
            image must be at most 4 MB.
        name:
          type: string
        size:
          type: integer
        alt:
          type: string
          description: Optional accessible caption for assistant-presented images.
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - workspace_path
        - title
        - model_id
        - provider_id
        - status
        - origin
        - token_usage
        - agent_mode
        - pinned
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        workspace_path:
          type: string
        title:
          type: string
        model_id:
          type: string
        provider_id:
          type: string
        status:
          type: string
          enum: [active, archived]
        origin:
          type: string
          enum: [user, autonomy]
          description: Whether this session was created by a user action or an autonomous job run.
        token_usage:
          $ref: '#/components/schemas/TokenUsage'
        agent_mode:
          $ref: '#/components/schemas/AgentMode'
          description: Active agent mode for the session. `auto` unless the user switched this session to `plan`.
        pinned:
          type: boolean
          description: Whether the session is pinned to the top of its workspace group.
        created_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds.
        updated_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds.
        parent_session_id:
          type: string
          description: Parent session ID for delegated child sessions.
        purpose:
