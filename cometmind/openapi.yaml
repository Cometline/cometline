    get:
      tags: [Sessions]
      summary: Fetch an assistant-presented image blob
      description: |
        Returns raw image bytes for a media-store id previously registered via
        `present_image` (or equivalent). Used by chat UIs when transcript items
        carry an image id without inline base64 data.
      operationId: getSessionMedia
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
