# Readability budgets for cometmind. `make lint-budget` reports these without
# failing. scripts/readability-report.sh --check fails CI unless every finding
# is named in scripts/readability-allowlist.txt. Move a linter into
# .golangci.yml once this file no longer reports it.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - funlen
    - gocyclo

  settings:
    funlen:
      lines: 80
      statements: -1
    gocyclo:
      min-complexity: 15

  exclusions:
    generated: lax
    rules:
      # Table-driven tests are allowed to be long.
      - path: _test\.go
        linters: [funlen, gocyclo]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # funlen and gocyclo both report on the func line; keep both.
  uniq-by-line: false
